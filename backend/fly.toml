# fly.toml — `fly deploy` from backend/. Secrets are set with `fly secrets set` (see SETUP.md).
# Run exactly ONE machine (`fly scale count 1`): the send loop runs in-process.
app = "mailblast-backend"
primary_region = "sin"

[build]

[env]
  PORT = "3001"
  AWS_REGION = "ap-southeast-2"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
